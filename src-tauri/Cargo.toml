[package]
name = "apimocktle"
version = "1.0.0"
edition = "2021"

[lib]
name = "apimocktle_lib"
# 只保留 rlib。cdylib/staticlib 仅移动端（iOS/Android）需要，
# 桌面端会额外产出 ~1.2G 的 .so/.a/.lib，纯浪费。
crate-type = ["lib"]

# 体积优化：WSL 内只跑 cargo test / cargo clippy，GUI 调试在宿主 Windows 上做。
# 依赖 crate 的 debuginfo 对定位无用（package."*" 不匹配本 crate 自身，已实测），
# 关掉后依赖 rlib 缩 ~45%；本 crate 保留 line-tables-only，panic backtrace 仍有行号。
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = 0

[features]
# 便携版：数据只读写 <exe 同级>/data，不回退 app_data_dir。见 src/portable.rs
portable = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.31", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
rand = "0.8"
scrypt = "0.11"
sha2 = "0.10"
hex = "0.4"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "multipart", "socks"] }
base64 = "0.22"
yrs = "0.20"
serde_yaml = "0.9"
thiserror = "1"
log = "0.4"
env_logger = "0.11"
futures-util = "0.3"
tokio-tungstenite = "0.21"
axum = "0.7"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["fs", "set-header"] }
local-ip-address = "0.6"
urlencoding = "2"
regex = "1"
rquickjs = "0.12.2"
